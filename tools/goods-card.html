<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>グッズの 宣伝画像 （tools/goods.mjs が つかう）</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=block" rel="stylesheet">
  <style>
    html, body { margin: 0; }
    .card {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      font-family: "DotGothic16", monospace; color: #fff;
      background:
        linear-gradient(rgba(120,200,255,.10) 2px, transparent 2px) 0 0 / 40px 40px,
        linear-gradient(90deg, rgba(120,200,255,.10) 2px, transparent 2px) 0 0 / 40px 40px,
        #0d1230;
    }
    .st { position: absolute; width: 8px; height: 8px; background: #fff; }
    .st.c { background: #3ee8ff; } .st.p { background: #ff5ca8; } .st.y { background: #ffd84a; }
    h1 { position: absolute; left: 0; right: 0; top: 34px; margin: 0; text-align: center; font-weight: normal; font-size: 54px; letter-spacing: 3px; text-shadow: 4px 4px 0 #ff5ca8, 0 0 24px #3ee8ff; }
    .sub { position: absolute; left: 0; right: 0; top: 112px; text-align: center; font-family: "Press Start 2P", monospace; font-size: 15px; color: #3ee8ff; letter-spacing: 3px; }
    .row { position: absolute; left: 40px; right: 40px; top: 190px; display: flex; justify-content: space-between; align-items: flex-end; }
    .k { width: 214px; text-align: center; }
    .k img { display: block; width: 100%; image-rendering: pixelated; filter: drop-shadow(0 0 18px rgba(62,232,255,.55)); }
    .k:nth-child(2n) img { filter: drop-shadow(0 0 18px rgba(255,92,168,.6)); }
    .k span { display: inline-block; margin-top: 18px; font-size: 21px; padding: 4px 10px 2px; border: 3px solid #3ee8ff; background: #0d1230; }
    .floor { position: absolute; left: 0; right: 0; top: 478px; height: 6px; background: #3ee8ff; box-shadow: 0 0 18px #3ee8ff; }
    .play { position: absolute; left: 0; right: 0; bottom: 36px; text-align: center; font-size: 28px; }
    .play b { font-weight: normal; color: #ffd84a; }
    .play em { font-style: normal; font-family: "Press Start 2P", monospace; font-size: 16px; color: #ff5ca8; margin-left: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <i class="st" style="left:60px;top:40px"></i><i class="st c" style="left:180px;top:120px"></i><i class="st y" style="left:1100px;top:60px"></i>
    <i class="st p" style="left:1010px;top:150px"></i><i class="st" style="left:300px;top:60px"></i><i class="st c" style="left:900px;top:36px"></i>
    <i class="st y" style="left:40px;top:560px"></i><i class="st p" style="left:1140px;top:560px"></i>
    <h1>ピクセたちの アクリルキーホルダー</h1>
    <div class="sub">PIXEL ACRYLIC KEYHOLDER</div>
    <div class="row">
      <div class="k"><img src="../goods/pikuse.png" alt=""><span>ピクセ</span></div>
      <div class="k"><img src="../goods/helmet.png" alt=""><span>いとこ</span></div>
      <div class="k"><img src="../goods/hakobi.png" alt=""><span>ハコビ</span></div>
      <div class="k"><img src="../goods/bachi.png" alt=""><span>バチ</span></div>
      <div class="k"><img src="../goods/ufo.png" alt=""><span>UFO</span></div>
    </div>
    <div class="play">ご注文を いただいてから つくる <b>受注生産</b><em>BOOTH</em></div>
  </div>
</body>
</html>
