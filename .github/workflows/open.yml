# 開店の あさ（2026-11-01 7:00 日本時間 = 10/31 22:00 UTC）に、製作所だよりへ「開店しました」を のせる。
# タグは つけない（v2.0 には しない。この おしらせは v1.27 の 一部 として docs/spec/v1.27.md に 書いた）
# GitHub の 予約は 混むと おくれる ことが ある。tools/open.mjs が 7じ まえ・2 回め は なにも しない ので、手で ながしても あんぜん
name: open
on:
  schedule:
    - cron: "0 22 31 10 *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 製作所だよりに「開店しました」
        id: news
        run: echo "result=$(node tools/open.mjs)" >> "$GITHUB_OUTPUT"
      - name: 公開
        if: steps.news.outputs.result == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "news: open WARPIX製作所 (2026-11-01-open)"
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
